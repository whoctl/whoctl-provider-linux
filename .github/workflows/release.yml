name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: make build
      - name: documentation bundle
        # Published once, not per platform: the pages and the schema are the
        # same whatever the binary was built for.
        if: matrix.goarch == 'amd64'
        run: make docs && mv bundle.json docs-bundle.json
      - name: package and checksum
        run: |
          # The name carries no version: GitHub's releases/latest/download/
          # URL only resolves a fixed asset name, and the tag already says
          # which release this is.
          name=whoctl-provider-linux-${{ matrix.goos }}_${{ matrix.goarch }}
          tar -C bin -czf "$name.tar.gz" .
          # The checksum is what a lockfile pins and what whoctl verifies before
          # it executes anything it downloaded.
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            docs-bundle.json

  # The site is built centrally, so a release has to tell it there is something
  # new. Without this the site only catches up on its nightly schedule.
  #
  # A cross-repository dispatch cannot use the default GITHUB_TOKEN, which is
  # scoped to this repository alone. WHOCTL_DOCS_TOKEN is a token with `contents:
  # write` on whoctl/whoctl-docs; the step is skipped when it is not set, so a
  # fork releases without failing here.
  notify-docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: ask whoctl-docs to rebuild
        if: env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.WHOCTL_DOCS_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/whoctl/whoctl-docs/dispatches \
            -d '{"event_type":"provider-released"}'
