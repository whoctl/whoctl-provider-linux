name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Every combination runs even after one fails, so a single broken backend
      # does not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - {distro: alpine, toolset: shadow}
          - {distro: alpine, toolset: busybox}
          - {distro: debian, toolset: shadow}
          - {distro: fedora, toolset: shadow}
          - {distro: arch, toolset: shadow}
    steps:
      # This job is the one place the sibling layout is still load-bearing: the
      # container harness lives in the CLI and e2e-run.sh reaches for
      # ../whoctl/scripts/sandbox.sh. That is a script, not a module — nothing
      # here needs a workspace.
      - uses: actions/checkout@v4
        with:
          path: whoctl-provider-linux
      - uses: actions/checkout@v4
        with:
          repository: whoctl/whoctl
          path: whoctl
      - uses: actions/setup-go@v5
        with:
          go-version-file: whoctl-provider-linux/go.mod
      - name: e2e
        working-directory: whoctl-provider-linux
        env:
          DISTRO: ${{ matrix.distro }}
          TOOLSET: ${{ matrix.toolset }}
          CONTAINER_ENGINE: docker
        run: scripts/e2e-run.sh
