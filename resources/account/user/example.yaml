apiVersion: linux.whoctl.io/v1alpha1
kind: User
metadata:
  name: alice
spec:
  uid: 4200
  primaryGroup: developers
  # Supplementary groups. An empty list would remove every membership;
  # omitting the field leaves memberships untouched.
  groups:
    - wheel
  shell: /bin/sh
  home: /home/alice
  comment: Alice Liddell
  createHome: true
