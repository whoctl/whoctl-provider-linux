# The other three repository kinds, for reference.
#
# This file is documentation rather than something to apply: each document only
# works on the distro whose manager it names, so no machine can accept all
# three. That is the point of splitting packages by manager — the manifest says
# which system it is for, and whoctl refuses the rest instead of guessing.
apiVersion: linux.whoctl.io/v1alpha1
kind: AptRepository
metadata:
  # Named after its file: /etc/apt/sources.list.d/docker.list.
  name: docker
spec:
  uri: https://download.docker.com/linux/debian
  suite: bookworm
  components: [stable]
  options:
    signed-by: /etc/apt/keyrings/docker.asc
---
apiVersion: linux.whoctl.io/v1alpha1
kind: DnfRepository
metadata:
  # Named after the section id, which is what `dnf --enablerepo` takes.
  name: docker-ce-stable
spec:
  displayName: Docker CE Stable
  baseurl: [https://download.docker.com/linux/fedora/$releasever/$basearch/stable]
  gpgcheck: true
  gpgkey: https://download.docker.com/linux/fedora/gpg
---
apiVersion: linux.whoctl.io/v1alpha1
kind: PacmanRepository
metadata:
  # Named after the section header in /etc/pacman.conf.
  name: multilib
spec:
  enabled: true
  include: /etc/pacman.d/mirrorlist
